name: Quality pipeline

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Carga completa nocturna, de lunes a viernes a las 06:00 UTC.
    - cron: '0 6 * * 1-5'
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente de GitHub del que se toman variables y secretos (BASE_URL vacía = instancia local en el runner)
        type: choice
        options: [ci, qa, staging]
        default: ci
      performance_profile:
        description: Perfil de carga
        type: choice
        options: [full, reduced]
        default: full

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Pruebas funcionales (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Imagen oficial de Playwright: Chromium y sus dependencias del sistema ya vienen instalados.
    # Instalarlos en cada corrida tomó 8 minutos en la primera ejecución real; las pruebas, 5 segundos.
    # La versión de la imagen debe coincidir con @playwright/test del package-lock.json.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    # Cada ambiente de GitHub define sus variables (BASE_URL, RISK_MODE) y secretos (RISK_API_TOKEN).
    environment: ${{ inputs.environment || 'ci' }}
    env:
      BASE_URL: ${{ vars.BASE_URL }}
      RISK_MODE: ${{ vars.RISK_MODE || 'approved' }}
      RISK_API_TOKEN: ${{ secrets.RISK_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Playwright levanta su propia instancia aislada (playwright.config.js); no se arranca la app a mano.
      - name: Ejecutar pruebas
        run: npm run test:e2e

      - name: Publicar reporte HTML
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Conservar videos, capturas y trazas del fallo
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-evidencia-fallo
          path: test-results/
          retention-days: 7

  performance:
    name: Rendimiento (k6)
    # No tiene sentido medir el rendimiento de un build funcionalmente roto.
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment || 'ci' }}
    env:
      BASE_URL: ${{ vars.BASE_URL || 'http://127.0.0.1:3000' }}
      # Pull requests: perfil reducido para no alargar cada PR. main, nightly y ejecución manual: perfil completo.
      PROFILE: ${{ github.event_name == 'pull_request' && 'reduced' || inputs.performance_profile || 'full' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: grafana/setup-k6-action@v1
        with:
          k6-version: '2.3.0'

      - name: Instalar dependencias
        run: npm ci

      - name: Levantar la aplicación en el runner
        if: ${{ vars.BASE_URL == '' }}
        env:
          DATABASE_PATH: artifacts/perf-db.json
          RISK_API_TOKEN: ${{ secrets.RISK_API_TOKEN }}
        run: |
          npm run db:reset
          nohup npm start > artifacts/app.log 2>&1 &
          timeout 30 bash -c 'until curl -sf http://127.0.0.1:3000/health > /dev/null; do sleep 1; done'

      # Si se incumple un umbral, k6 termina con código 99 y el job falla: no hay "|| true".
      - name: Ejecutar prueba de carga (perfil ${{ env.PROFILE }})
        run: |
          if [ "$PROFILE" = "reduced" ]; then export VUS=10 DURATION=1m; fi
          npm run test:performance

      - name: Resumen de rendimiento
        if: ${{ !cancelled() }}
        run: node .github/scripts/performance-summary.js

      - name: Publicar reporte de rendimiento
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: k6-report
          path: |
            performance/results/
            artifacts/app.log
          if-no-files-found: ignore
          retention-days: 14
